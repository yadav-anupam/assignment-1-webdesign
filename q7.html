        <h2>Question 7:</h2>
        <p>
            Create a form demonstrating different HTML5 input types.
        </p><hr>
        <h3>Answer:</h3>
        <h2>HTML5 Input Types</h2>
        <form>
            <label for="name">Text:</label>
            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Enter your name"
                   required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="example@gmail.com"
                   required>
            <br><br>
            <label for="password">Password:</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter password"
                   minlength="8"
                   required>
            <br><br>
            <label for="age">Age:</label>
            <input type="number"
                   id="age"
                   name="age"
                   min="1"
                   max="100"
                   placeholder="Enter your age"
                   required>
            <br><br>
            <label for="dob">Date:</label>
            <input type="date"
                   id="dob"
                   name="dob"
                   required>
            <br><br>
            <label for="time">Time:</label>
            <input type="time"
                   id="time"
                   name="time"
                   required>
            <br><br>
            <label for="color">Color:</label>
            <input type="color"
                   id="color"
                   name="color">
            <br><br>
            <label for="range">Range:</label>
            <input type="range"
                   id="range"
                   name="range"
                   min="0"
                   max="100"
                   value="50">
            <br><br>
            <label for="file">File:</label>
            <input type="file"
                   id="file"
                   name="file">
            <br><br>
            <label>Checkbox:</label>
            <input type="checkbox"
                   id="html"
                   name="skills"
                   value="HTML">
            <label for="html">HTML</label>
            <input type="checkbox"
                   id="css"
                   name="skills"
                   value="CSS">
            <label for="css">CSS</label>
            <input type="checkbox"
                   id="javascript"
                   name="skills"
                   value="JavaScript">
            <label for="javascript">JavaScript</label>
            <br><br>
            <label>Radio:</label>
            <input type="radio"
                   id="male"
                   name="gender"
                   value="Male"
                   required>
            <label for="male">Male</label>
            <input type="radio"
                   id="female"
                   name="gender"
                   value="Female">
            <label for="female">Female</label>
            <input type="radio"
                   id="other"
                   name="gender"
                   value="Other">
            <label for="other">Other</label>
            <br><br>
            <label for="website">URL:</label>
            <input type="url"
                   id="website"
                   name="website"
                   placeholder="https://anupam-yadavv.vercel.app">
            <br><br>
            <label for="search">Search:</label>
            <input type="search"
                   id="search"
                   name="search"
                   placeholder="Search here">
            <br><br>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </form>
